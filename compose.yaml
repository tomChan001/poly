services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: poly
      POSTGRES_USER: poly
      POSTGRES_PASSWORD: poly
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poly -d poly"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - poly-postgres:/var/lib/postgresql/data

volumes:
  poly-postgres:

