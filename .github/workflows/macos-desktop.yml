name: macOS desktop validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      arm64_artifact_run_id:
        description: Existing workflow run whose Apple Silicon DMG should be re-smoked
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-native:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.arm64_artifact_run_id == '' }}
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rust_target: aarch64-apple-darwin
            py_arch: arm64
            artifact: Poly-macos-arm64
          - runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            py_arch: x86_64
            artifact: Poly-macos-x86_64
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      UV_PYTHON: '3.12.11'
      UV_MANAGED_PYTHON: '1'
      POLY_TARGET_ARCH: ${{ matrix.py_arch }}
      POLY_TARGET_TRIPLE: ${{ matrix.rust_target }}
      IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      SIGNING_SECRETS_PRESENT: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.8.15'
          enable-cache: true

      - name: Install pinned managed Python
        run: uv python install "${UV_PYTHON}"

      - name: Install frozen Python environment
        run: uv sync --frozen

      - name: Lint Python
        run: uv run --frozen ruff check .

      - name: Run mocked Python tests
        env:
          OPENING_ENABLED: 'false'
          LOCAL_SETUP_ENABLED: 'false'
        run: |
          uv run --frozen pytest \
            backend/tests/unit \
            backend/tests/security \
            backend/tests/integration/api/test_desktop_session.py \
            packaging/macos/tests/test_distribution_contract.py \
            packaging/macos/tests/test_ci_documentation_contract.py \
            -q

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          targets: ${{ matrix.rust_target }}
          components: rustfmt, clippy

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust_target }}

      - name: Confirm native Rust target
        run: rustup target add "${POLY_TARGET_TRIPLE}"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Stage empty runtime directory for Rust checks
        run: mkdir -p src-tauri/resources/poly-runtime

      - name: Lint Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --target "${POLY_TARGET_TRIPLE}" -- -D warnings

      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target "${POLY_TARGET_TRIPLE}"

      - name: Build pinned PostgreSQL natively
        run: packaging/macos/fetch-postgres.sh

      - name: Build packaged Python runtime natively
        env:
          POLY_EXPECTED_PARENT_TEAM_ID: ${{ env.IS_RELEASE == 'true' && secrets.APPLE_TEAM_ID || 'ADHOC_VALIDATION_ONLY' }}
        run: packaging/macos/build-runtime.sh

      - name: Verify packaged Python runtime
        run: packaging/macos/verify-runtime.sh

      - name: Stage complete runtime and generate assembled notices
        run: |
          mkdir -p src-tauri/resources
          ditto dist/poly-runtime src-tauri/resources/poly-runtime
          packaging/macos/generate-notices.sh --assembled

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Require every protected secret for release tags
        if: ${{ env.IS_RELEASE == 'true' && env.SIGNING_SECRETS_PRESENT != 'true' }}
        run: |
          printf '%s\n' 'A release tag requires the complete protected Apple signing secret set.' >&2
          exit 1

      - name: Import Developer ID certificate into temporary keychain
        if: ${{ env.IS_RELEASE == 'true' && env.SIGNING_SECRETS_PRESENT == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/poly-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          CERTIFICATE_PATH="${RUNNER_TEMP}/poly-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.p12"
          printf 'POLY_SIGNING_KEYCHAIN=%s\n' "${KEYCHAIN_PATH}" >>"${GITHUB_ENV}"
          printf 'POLY_SIGNING_CERTIFICATE=%s\n' "${CERTIFICATE_PATH}" >>"${GITHUB_ENV}"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode >"${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -k "${KEYCHAIN_PATH}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"

      - name: Build ad-hoc validation App and DMG
        if: ${{ env.IS_RELEASE != 'true' }}
        working-directory: src-tauri
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: cargo tauri build --target "${POLY_TARGET_TRIPLE}"

      - name: Developer ID sign and notarize release App and DMG
        if: ${{ env.IS_RELEASE == 'true' && env.SIGNING_SECRETS_PRESENT == 'true' }}
        working-directory: src-tauri
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo tauri build --target "${POLY_TARGET_TRIPLE}"

      - name: Staple and validate release tickets
        if: ${{ env.IS_RELEASE == 'true' && env.SIGNING_SECRETS_PRESENT == 'true' }}
        run: |
          APP_PATH="${GITHUB_WORKSPACE}/src-tauri/target/${POLY_TARGET_TRIPLE}/release/bundle/macos/Poly.app"
          DMG_PATH="$(find "${GITHUB_WORKSPACE}/src-tauri/target/${POLY_TARGET_TRIPLE}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -d "${APP_PATH}"
          test -n "${DMG_PATH}"
          xcrun stapler staple "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"
          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"

      - name: Verify release bundle or ad-hoc contract
        run: |
          APP_PATH="${GITHUB_WORKSPACE}/src-tauri/target/${POLY_TARGET_TRIPLE}/release/bundle/macos/Poly.app"
          if [[ "${IS_RELEASE}" == 'true' ]]; then
            packaging/macos/verify-bundle.sh "${APP_PATH}"
          else
            packaging/macos/verify-bundle.sh --audit-bundle "${APP_PATH}"
          fi

      - name: Install DMG into an isolated home and smoke test
        timeout-minutes: 10
        env:
          SMOKE_ACCOUNT: ci-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          SMOKE_ROOT="$(mktemp -d "${RUNNER_TEMP}/poly-smoke.XXXXXXXX")"
          SMOKE_HOME="${SMOKE_ROOT}/home"
          SMOKE_APPLICATIONS="${SMOKE_ROOT}/Applications"
          GUARD_DIR="${SMOKE_ROOT}/guard-bin"
          GUARD_LOG="${SMOKE_ROOT}/ambient-command.log"
          KEYCHAIN_RESTORE_FAILURE="${SMOKE_ROOT}/keychain-restore-failure.log"
          DIAGNOSTICS_DIR="${RUNNER_TEMP}/poly-diagnostics/smoke-${POLY_TARGET_ARCH}"
          MOUNT_POINT="${SMOKE_ROOT}/mounted-dmg"
          SMOKE_KEYCHAIN="${SMOKE_ROOT}/ci-smoke.keychain-db"
          SMOKE_KEYCHAIN_PASSWORD="$(uuidgen)"
          SMOKE_SECRET="$(uuidgen)"
          APP_PATH="${GITHUB_WORKSPACE}/src-tauri/target/${POLY_TARGET_TRIPLE}/release/bundle/macos/Poly.app"
          DMG_PATH="$(find "${GITHUB_WORKSPACE}/src-tauri/target/${POLY_TARGET_TRIPLE}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          INSTALLED_APP="${SMOKE_APPLICATIONS}/Poly.app"
          RUNTIME_ROOT="${INSTALLED_APP}/Contents/Resources/poly-runtime"
          RUNTIME_EXECUTABLE="${RUNTIME_ROOT}/poly-runtime"

          trim_keychain_path() {
            /usr/bin/sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//'
          }
          ORIGINAL_DEFAULT_KEYCHAIN=""
          ORIGINAL_KEYCHAINS=()
          if [[ "${IS_RELEASE}" == 'true' ]]; then
            ORIGINAL_DEFAULT_KEYCHAIN="$(/usr/bin/security default-keychain -d user | trim_keychain_path)"
            while IFS= read -r keychain_path; do
              keychain_path="$(printf '%s\n' "${keychain_path}" | trim_keychain_path)"
              [[ -n "${keychain_path}" ]] && ORIGINAL_KEYCHAINS+=("${keychain_path}")
            done < <(/usr/bin/security list-keychains -d user)
            [[ -n "${ORIGINAL_DEFAULT_KEYCHAIN}" ]]
            [[ "${#ORIGINAL_KEYCHAINS[@]}" -gt 0 ]]
          fi
          mkdir -p "${SMOKE_HOME}/Library/Application Support" "${SMOKE_HOME}/Library/Caches"
          mkdir -p "${SMOKE_APPLICATIONS}" "${GUARD_DIR}" "${MOUNT_POINT}" "${DIAGNOSTICS_DIR}"
          chmod 700 "${SMOKE_HOME}" "${SMOKE_APPLICATIONS}"
          : >"${GUARD_LOG}"

          for command_name in python python3 node postgres aws docker brew; do
            printf '%s\n' '#!/bin/sh' \
              'printf "%s\\n" "${0##*/}" >>"${POLY_GUARD_LOG}"' \
              'exit 97' >"${GUARD_DIR}/${command_name}"
            chmod 700 "${GUARD_DIR}/${command_name}"
          done

          mounted=0
          keychain_created=0
          restore_keychains() {
            local restore_failed=0
            /usr/bin/security default-keychain -d user -s "${ORIGINAL_DEFAULT_KEYCHAIN}" >/dev/null 2>&1 || restore_failed=1
            /usr/bin/security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" >/dev/null 2>&1 || restore_failed=1
            if [[ "${restore_failed}" -ne 0 ]]; then
              printf 'failed to restore original user Keychain configuration\n' >"${KEYCHAIN_RESTORE_FAILURE}"
              return 1
            fi
          }
          copy_smoke_diagnostics() {
            /bin/mkdir -p "${DIAGNOSTICS_DIR}"
            /bin/cp "${GUARD_LOG}" "${DIAGNOSTICS_DIR}/ambient-command.log" 2>/dev/null || true
            /bin/cp "${KEYCHAIN_RESTORE_FAILURE}" "${DIAGNOSTICS_DIR}/keychain-restore-failure.log" 2>/dev/null || true
          }
          cleanup_smoke() {
            local original_status="$1"
            local cleanup_status=0
            /usr/bin/osascript -e 'tell application id "com.poly.desktop" to quit' >/dev/null 2>&1 || true
            if [[ "${keychain_created}" -eq 1 ]]; then
              if restore_keychains; then
                /usr/bin/security delete-keychain "${SMOKE_KEYCHAIN}" >/dev/null 2>&1 || cleanup_status=1
              else
                printf 'temporary Keychain retained because restoration failed\n' >>"${KEYCHAIN_RESTORE_FAILURE}"
                cleanup_status=1
              fi
            fi
            if [[ "${mounted}" -eq 1 ]]; then
              /usr/bin/hdiutil detach "${MOUNT_POINT}" -force >/dev/null 2>&1 || true
            fi
            copy_smoke_diagnostics
            trap - EXIT INT TERM
            if [[ "${original_status}" -ne 0 ]]; then
              exit "${original_status}"
            fi
            exit "${cleanup_status}"
          }
          trap 'cleanup_smoke $?' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          test -d "${APP_PATH}"
          test -n "${DMG_PATH}"
          /usr/bin/hdiutil attach "${DMG_PATH}" -mountpoint "${MOUNT_POINT}" -nobrowse -readonly
          mounted=1
          SOURCE_APP="$(/usr/bin/find "${MOUNT_POINT}" -maxdepth 1 -type d -name 'Poly.app' -print -quit)"
          test -n "${SOURCE_APP}"
          /usr/bin/ditto "${SOURCE_APP}" "${INSTALLED_APP}"
          /usr/bin/hdiutil detach "${MOUNT_POINT}"
          mounted=0

          if [[ "${IS_RELEASE}" == 'true' ]]; then
            /usr/bin/security create-keychain -p "${SMOKE_KEYCHAIN_PASSWORD}" "${SMOKE_KEYCHAIN}"
            keychain_created=1
            /usr/bin/security set-keychain-settings -lut 21600 "${SMOKE_KEYCHAIN}"
            /usr/bin/security unlock-keychain -p "${SMOKE_KEYCHAIN_PASSWORD}" "${SMOKE_KEYCHAIN}"
            /usr/bin/security list-keychains -d user -s "${SMOKE_KEYCHAIN}" "${ORIGINAL_KEYCHAINS[@]}"
            /usr/bin/security default-keychain -d user -s "${SMOKE_KEYCHAIN}"
          fi

          export HOME="${SMOKE_HOME}"
          export PATH="${GUARD_DIR}:/usr/bin:/bin:/usr/sbin:/sbin"
          export POLY_GUARD_LOG="${GUARD_LOG}"
          if [[ "${IS_RELEASE}" == 'true' ]]; then
            printf '%s' "${SMOKE_SECRET}" \
              | "${RUNTIME_EXECUTABLE}" --keychain-smoke set --account "${SMOKE_ACCOUNT}" >/dev/null
          fi
          app_count="$(/usr/bin/osascript -e 'tell application "System Events" to count (application processes whose bundle identifier is "com.poly.desktop")')"
          [[ "${app_count}" -eq 0 ]]
          /usr/bin/open -n "${INSTALLED_APP}"
          for ((attempt = 1; attempt <= 60; attempt++)); do
            runtime_pids="$("${GITHUB_WORKSPACE}/packaging/macos/verify-bundle.sh" --enumerate-runtime "${RUNTIME_ROOT}/" "${INSTALLED_APP}/Contents/MacOS/Poly")"
            listener_found=0
            while IFS= read -r pid; do
              [[ -n "${pid}" ]] || continue
              if /usr/sbin/lsof -nP -a -p "${pid}" -iTCP -sTCP:LISTEN | /usr/bin/grep -q 'TCP 127.0.0.1:'; then
                listener_found=1
                break
              fi
            done <<<"${runtime_pids}"
            [[ "${listener_found}" -eq 1 ]] && break
            /bin/sleep 1
          done
          [[ "${listener_found}" -eq 1 ]]

          /usr/bin/osascript -e 'tell application id "com.poly.desktop" to quit'
          for ((attempt = 1; attempt <= 30; attempt++)); do
            remaining="$("${GITHUB_WORKSPACE}/packaging/macos/verify-bundle.sh" --enumerate-runtime "${RUNTIME_ROOT}/" "${INSTALLED_APP}/Contents/MacOS/Poly")"
            app_count="$(/usr/bin/osascript -e 'tell application "System Events" to count (application processes whose bundle identifier is "com.poly.desktop")')"
            [[ -z "${remaining}" && "${app_count}" -eq 0 ]] && break
            /bin/sleep 1
          done
          [[ -z "${remaining}" && "${app_count}" -eq 0 ]]

          /usr/bin/open -n "${INSTALLED_APP}"
          /bin/sleep 2
          if [[ "${IS_RELEASE}" == 'true' ]]; then
            printf '%s' "${SMOKE_SECRET}" \
              | "${RUNTIME_EXECUTABLE}" --keychain-smoke verify --account "${SMOKE_ACCOUNT}" >/dev/null
          fi
          /usr/bin/open -n "${INSTALLED_APP}"
          /bin/sleep 3
          app_count="$(/usr/bin/osascript -e 'tell application "System Events" to count (application processes whose bundle identifier is "com.poly.desktop")')"
          [[ "${app_count}" -eq 1 ]]

          /usr/bin/osascript -e 'tell application id "com.poly.desktop" to quit'
          for ((attempt = 1; attempt <= 30; attempt++)); do
            remaining="$("${GITHUB_WORKSPACE}/packaging/macos/verify-bundle.sh" --enumerate-runtime "${RUNTIME_ROOT}/" "${INSTALLED_APP}/Contents/MacOS/Poly")"
            app_count="$(/usr/bin/osascript -e 'tell application "System Events" to count (application processes whose bundle identifier is "com.poly.desktop")')"
            [[ -z "${remaining}" && "${app_count}" -eq 0 ]] && break
            /bin/sleep 1
          done
          [[ -z "${remaining}" && "${app_count}" -eq 0 ]]
          if [[ "${IS_RELEASE}" == 'true' ]]; then
            "${RUNTIME_EXECUTABLE}" --keychain-smoke delete --account "${SMOKE_ACCOUNT}" >/dev/null
          fi
          copy_smoke_diagnostics
          [[ ! -s "${GUARD_LOG}" ]]

      - name: Remove temporary signing keychain
        if: ${{ always() && env.IS_RELEASE == 'true' }}
        run: |
          KEYCHAIN_PATH="${POLY_SIGNING_KEYCHAIN:-${RUNNER_TEMP}/poly-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db}"
          CERTIFICATE_PATH="${POLY_SIGNING_CERTIFICATE:-${RUNNER_TEMP}/poly-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.p12}"
          security delete-keychain "${KEYCHAIN_PATH}" >/dev/null 2>&1 || true
          rm -f -- "${CERTIFICATE_PATH}"

      - name: Collect sanitized validation diagnostics
        if: ${{ always() && env.IS_RELEASE != 'true' }}
        run: |
          set +e
          DIAGNOSTICS_DIR="${RUNNER_TEMP}/poly-diagnostics"
          APP_PATH="${GITHUB_WORKSPACE}/src-tauri/target/${POLY_TARGET_TRIPLE}/release/bundle/macos/Poly.app"
          /bin/mkdir -p "${DIAGNOSTICS_DIR}"
          {
            printf 'commit=%s\n' "${GITHUB_SHA}"
            printf 'runner=%s\n' "${RUNNER_OS}"
            printf 'target=%s\n' "${POLY_TARGET_TRIPLE}"
            /usr/bin/uname -a
            /usr/bin/xcodebuild -version
            rustc --version
            cargo --version
          } >"${DIAGNOSTICS_DIR}/toolchain.txt" 2>&1
          if [[ -d "${APP_PATH}" ]]; then
            /usr/bin/codesign --verify --deep --strict --verbose=4 "${APP_PATH}" \
              >"${DIAGNOSTICS_DIR}/codesign-verify.txt" 2>&1
            /usr/bin/find "${APP_PATH}/Contents" -maxdepth 4 -type f -print \
              | /usr/bin/sort >"${DIAGNOSTICS_DIR}/bundle-files.txt"
          fi
          DATA_ROOT="${RUNNER_TEMP}"
          /usr/bin/find "${DATA_ROOT}" -path '*/Library/Application Support/Poly/*' -type f \
            -exec /usr/bin/stat -f '%N %z bytes' {} \; \
            >"${DIAGNOSTICS_DIR}/smoke-data-files.txt" 2>/dev/null

      - name: Upload validation diagnostics
        if: ${{ always() && env.IS_RELEASE != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/poly-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload architecture-specific DMG
        if: ${{ !cancelled() && (success() || env.IS_RELEASE != 'true') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  resmoke-arm64-artifact:
    name: Re-smoke existing Apple Silicon DMG
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.arm64_artifact_run_id != '' }}
    runs-on: macos-15
    timeout-minutes: 10
    env:
      POLY_TARGET_ARCH: arm64
      POLY_TARGET_TRIPLE: aarch64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download existing Apple Silicon DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/poly-resmoke-artifact"
          gh run download "${{ inputs.arm64_artifact_run_id }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name Poly-macos-arm64 \
            --dir "${RUNNER_TEMP}/poly-resmoke-artifact"
          DMG_PATH="$(find "${RUNNER_TEMP}/poly-resmoke-artifact" -type f -name '*.dmg' -print -quit)"
          test -n "${DMG_PATH}"
          printf 'DMG_PATH=%s\n' "${DMG_PATH}" >>"${GITHUB_ENV}"

      - name: Re-smoke installed DMG with explicit phases
        run: |
          set -euo pipefail
          SMOKE_ROOT="$(mktemp -d "${RUNNER_TEMP}/poly-resmoke.XXXXXXXX")"
          SMOKE_HOME="${SMOKE_ROOT}/home"
          SMOKE_APPLICATIONS="${SMOKE_ROOT}/Applications"
          MOUNT_POINT="${SMOKE_ROOT}/mounted-dmg"
          INSTALLED_APP="${SMOKE_APPLICATIONS}/Poly.app"
          RUNTIME_ROOT="${INSTALLED_APP}/Contents/Resources/poly-runtime"
          RUNTIME_EXECUTABLE="${RUNTIME_ROOT}/poly-runtime"
          RUNTIME_ORIGINAL="${RUNTIME_ROOT}/poly-runtime.real"
          APP_EXECUTABLE="${INSTALLED_APP}/Contents/MacOS/Poly"
          APP_STDOUT="${SMOKE_ROOT}/app.stdout.log"
          APP_STDERR="${SMOKE_ROOT}/app.stderr.log"
          RUNTIME_PROTOCOL_LOG="${SMOKE_HOME}/runtime.protocol.log"
          mounted=0
          app_pid=''
          runtime_pids_seen=''

          cleanup() {
            set +e
            /usr/bin/osascript -e 'tell application id "com.poly.desktop" to quit' >/dev/null 2>&1
            if [[ "${mounted}" -eq 1 ]]; then
              /usr/bin/hdiutil detach "${MOUNT_POINT}" -force >/dev/null 2>&1
            fi
          }
          dump_diagnostics() {
            local log_file
            printf '%s\n' '--- re-smoke process snapshot ---' >&2
            /bin/ps -ww -axo pid=,ppid=,state=,etime=,args= >&2 || true
            printf '%s\n' '--- re-smoke files under isolated home ---' >&2
            /usr/bin/find "${SMOKE_HOME}" -type f -maxdepth 10 -print >&2 || true
            for log_file in \
              "${APP_STDOUT}" \
              "${APP_STDERR}" \
              "${RUNTIME_PROTOCOL_LOG}" \
              "${SMOKE_HOME}/Library/Application Support/Poly/logs/runtime.stderr.log" \
              "${SMOKE_HOME}/Library/Application Support/Poly/logs/runtime.stderr.log.1"; do
              [[ -f "${log_file}" ]] || continue
              printf '%s\n' "--- ${log_file} (last 200 lines) ---" >&2
              /usr/bin/tail -n 200 "${log_file}" >&2 || true
            done
          }
          finish() {
            local status=$?
            trap - EXIT
            if [[ "${status}" -ne 0 ]]; then
              dump_diagnostics
            fi
            cleanup
            exit "${status}"
          }
          fail_smoke() {
            printf 're-smoke failed: %s\n' "$1" >&2
            return 1
          }
          enumerate_runtime() {
            local output root_pid="$1"
            if ! output="$(packaging/macos/verify-bundle.sh --enumerate-runtime-from-pid "${RUNTIME_ROOT}/" "${root_pid}")"; then
              fail_smoke 'runtime process enumeration failed'
              return 1
            fi
            printf '%s' "${output}"
          }
          app_count() {
            /usr/bin/osascript -e 'tell application "System Events" to count (application processes whose bundle identifier is "com.poly.desktop")'
          }
          wait_for_listener() {
            local attempt listener_found pid runtime_pids
            for ((attempt = 1; attempt <= 60; attempt++)); do
              runtime_pids="$(enumerate_runtime "${app_pid}")"
              runtime_pids_seen="${runtime_pids}"
              listener_found=0
              while IFS= read -r pid; do
                [[ -n "${pid}" ]] || continue
                if /usr/sbin/lsof -nP -a -p "${pid}" -iTCP -sTCP:LISTEN | /usr/bin/grep -q 'TCP 127.0.0.1:'; then
                  listener_found=1
                  break
                fi
              done <<<"${runtime_pids}"
              if [[ "${listener_found}" -eq 1 ]]; then
                return 0
              fi
              if /usr/bin/grep -q '"state":"failed"' "${RUNTIME_PROTOCOL_LOG}"; then
                fail_smoke 'runtime reported a terminal failure before listener'
                return 1
              fi
              if ! /bin/kill -0 "${app_pid}" 2>/dev/null; then
                fail_smoke "app exited before its loopback listener was ready (PID ${app_pid})"
                return 1
              fi
              /bin/sleep 1
            done
            fail_smoke 'no owned loopback listener appeared within 60 seconds'
          }
          wait_for_shutdown() {
            local app_alive attempt count orphaned pid remaining
            for ((attempt = 1; attempt <= 30; attempt++)); do
              app_alive=0
              /bin/kill -0 "${app_pid}" 2>/dev/null && app_alive=1
              remaining=''
              while IFS= read -r pid; do
                [[ -n "${pid}" ]] || continue
                if /bin/kill -0 "${pid}" 2>/dev/null; then
                  remaining="${remaining}${remaining:+,}${pid}"
                fi
              done <<<"${runtime_pids_seen}"
              count="$(app_count)"
              if [[ "${app_alive}" -eq 0 && -z "${remaining}" && "${count}" -eq 0 ]]; then
                orphaned="$(packaging/macos/verify-bundle.sh --enumerate-runtime "${RUNTIME_ROOT}/")"
                [[ -z "${orphaned}" ]] && return 0
                remaining="${orphaned}"
              fi
              /bin/sleep 1
            done
            fail_smoke "shutdown left processes: app_alive=${app_alive:-unknown} runtime=${remaining:-none} app_count=${count:-unknown}"
          }
          launch_app() {
            "${APP_EXECUTABLE}" >>"${APP_STDOUT}" 2>>"${APP_STDERR}" &
            app_pid=$!
            runtime_pids_seen=''
          }
          install_runtime_trace_wrapper() {
            /bin/mv "${RUNTIME_EXECUTABLE}" "${RUNTIME_ORIGINAL}"
            /bin/cat >"${SMOKE_ROOT}/runtime-protocol-proxy.c" <<'TRACE_PROXY'
          #include <errno.h>
          #include <fcntl.h>
          #include <limits.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/types.h>
          #include <unistd.h>

          static void write_all(int descriptor, const char *buffer, size_t length) {
            while (length > 0) {
              ssize_t written = write(descriptor, buffer, length);
              if (written < 0 && errno == EINTR) continue;
              if (written <= 0) return;
              buffer += written;
              length -= (size_t)written;
            }
          }

          int main(int argc, char **argv) {
            char runtime_path[PATH_MAX];
            char log_path[PATH_MAX];
            if (argc < 1 || argv[0] == NULL) return 111;
            const char *home = getenv("HOME");
            const char *slash = strrchr(argv[0], '/');
            if (home == NULL || slash == NULL) return 111;
            size_t directory_length = (size_t)(slash - argv[0]);
            if (directory_length + sizeof("/poly-runtime.real") > sizeof(runtime_path)) return 112;
            memcpy(runtime_path, argv[0], directory_length);
            strcpy(runtime_path + directory_length, "/poly-runtime.real");
            if (snprintf(log_path, sizeof(log_path), "%s/runtime.protocol.log", home) >= (int)sizeof(log_path)) return 113;

            int stream[2];
            if (pipe(stream) != 0) return 114;
            int original_stdout = dup(STDOUT_FILENO);
            if (original_stdout < 0) return 115;
            pid_t proxy_pid = fork();
            if (proxy_pid < 0) return 116;
            if (proxy_pid == 0) {
              close(stream[1]);
              int log = open(log_path, O_WRONLY | O_CREAT | O_APPEND, 0600);
              if (log < 0) return 117;
              char buffer[4096];
              ssize_t count;
              while ((count = read(stream[0], buffer, sizeof(buffer))) > 0) {
                write_all(log, buffer, (size_t)count);
                write_all(original_stdout, buffer, (size_t)count);
              }
              close(log);
              close(original_stdout);
              close(stream[0]);
              return 0;
            }

            close(stream[0]);
            if (dup2(stream[1], STDOUT_FILENO) < 0) return 118;
            close(stream[1]);
            close(original_stdout);
            argv[0] = runtime_path;
            execv(runtime_path, argv);
            perror("runtime protocol proxy execv");
            return 127;
          }
          TRACE_PROXY
            /usr/bin/xcrun clang -std=c11 -Os -Wall -Wextra -Werror \
              "${SMOKE_ROOT}/runtime-protocol-proxy.c" -o "${RUNTIME_EXECUTABLE}"
            /usr/bin/codesign --force --deep --sign - "${INSTALLED_APP}"
          }
          restore_runtime_executable() {
            /bin/rm -f "${RUNTIME_EXECUTABLE}"
            /bin/mv "${RUNTIME_ORIGINAL}" "${RUNTIME_EXECUTABLE}"
            /usr/bin/codesign --force --deep --sign - "${INSTALLED_APP}"
          }
          trap finish EXIT
          trap 'exit 130' INT TERM

          mkdir -p "${SMOKE_HOME}/Library/Application Support" "${SMOKE_HOME}/Library/Caches"
          mkdir -p "${SMOKE_APPLICATIONS}" "${MOUNT_POINT}"
          chmod 700 "${SMOKE_HOME}" "${SMOKE_APPLICATIONS}"
          /usr/bin/hdiutil attach "${DMG_PATH}" -mountpoint "${MOUNT_POINT}" -nobrowse -readonly
          mounted=1
          SOURCE_APP="$(/usr/bin/find "${MOUNT_POINT}" -maxdepth 1 -type d -name 'Poly.app' -print -quit)"
          test -n "${SOURCE_APP}"
          /usr/bin/ditto "${SOURCE_APP}" "${INSTALLED_APP}"
          /usr/bin/hdiutil detach "${MOUNT_POINT}"
          mounted=0
          export HOME="${SMOKE_HOME}"
          : >"${APP_STDOUT}"
          : >"${APP_STDERR}"
          : >"${RUNTIME_PROTOCOL_LOG}"
          install_runtime_trace_wrapper

          count="$(app_count)"
          [[ "${count}" -eq 0 ]] || fail_smoke "expected no running app before launch, found ${count}"
          launch_app
          wait_for_listener
          printf 're-smoke phase: listener ready\n'

          /usr/bin/osascript -e 'tell application id "com.poly.desktop" to quit'
          wait_for_shutdown
          printf 're-smoke phase: first shutdown complete\n'
          printf '%s\n' '--- captured runtime protocol ---'
          /usr/bin/tail -n 200 "${RUNTIME_PROTOCOL_LOG}"
          restore_runtime_executable

          launch_app
          wait_for_listener
          "${APP_EXECUTABLE}" >>"${APP_STDOUT}" 2>>"${APP_STDERR}" &
          second_pid=$!
          /bin/sleep 3
          count="$(app_count)"
          [[ "${count}" -eq 1 ]] || fail_smoke "single-instance check expected 1 app process, found ${count}"
          ! /bin/kill -0 "${second_pid}" 2>/dev/null || fail_smoke "second app process remained alive: ${second_pid}"
          printf 're-smoke phase: single instance confirmed\n'

          /usr/bin/osascript -e 'tell application id "com.poly.desktop" to quit'
          wait_for_shutdown
          printf 're-smoke phase: final shutdown complete\n'
