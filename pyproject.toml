[project]
name = "controlled-execution"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "prometheus-client>=0.26.0",
    "py-clob-client-v2>=1.1.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.3",
    "websockets>=17.0.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pip-licenses>=5.0.0",
    "pyinstaller>=6.22.0,<7",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["backend/tests"]
