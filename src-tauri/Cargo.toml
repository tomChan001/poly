[package]
name = "poly-desktop"
version = "0.1.0"
description = "Poly local desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "poly_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "poly-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }
url = "2"
